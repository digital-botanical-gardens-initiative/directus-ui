name: Build and publish sample explorer

on:
  workflow_call:
    inputs:
      source_ref:
        description: DBGI source commit or branch to publish
        type: string
        default: main
      site:
        description: Published site scope (dbgi gardens or unrestricted emi)
        type: string
        default: emi
    secrets:
      DIRECTUS_READ_TOKEN:
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_READ_TOKEN }}
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          repository: digital-botanical-gardens-initiative/directus-ui
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh resolved taxonomy snapshot
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_snapshot.py
      - name: Refresh Directus collectors and linked samples
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_collectors.py
      - name: Refresh Directus garden progress snapshot
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_garden_progress.py
      - name: Refresh Directus MS profiling, instruments and injection-method polarity
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_ms_profile.py
      - name: Refresh Directus specimen processing lineage
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_processing.py
      - name: Refresh Directus-linked iNaturalist observations
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_inaturalist.py
      - name: Record completed Directus refresh
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_refresh_manifest.py
      - name: Use committed snapshot when token is unavailable
        if: env.DIRECTUS_TOKEN == ''
        run: echo "::warning::DIRECTUS_READ_TOKEN is not configured; publishing committed snapshots without refreshing them"
      - name: Stage scoped static site
        env:
          SITE: ${{ inputs.site }}
        run: python scripts/stage_site.py --site "$SITE"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
