name: Publish dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 8 * * *'
      timezone: "Europe/Zurich"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    uses: ./.github/workflows/publish-site.yml
    with:
      source_ref: ${{ github.sha }}
      site: dbgi
    secrets:
      DIRECTUS_READ_TOKEN: ${{ secrets.DIRECTUS_READ_TOKEN }}
