name: Publish dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 8 * * *'
      timezone: "Europe/Zurich"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_READ_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh resolved taxonomy snapshot
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_snapshot.py
      - name: Refresh Directus collectors and linked samples
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_collectors.py
      - name: Refresh Directus garden progress snapshot
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_garden_progress.py
      - name: Refresh Directus MS profiling and instruments
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_ms_profile.py
      - name: Refresh Directus specimen processing lineage
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_processing.py
      - name: Refresh Directus-linked iNaturalist observations
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_inaturalist.py
      - name: Record completed Directus refresh
        if: env.DIRECTUS_TOKEN != ''
        run: python scripts/build_refresh_manifest.py
      - name: Use committed snapshot when token is unavailable
        if: env.DIRECTUS_TOKEN == ''
        run: echo "::warning::DIRECTUS_READ_TOKEN is not configured; publishing committed snapshots without refreshing them"
      - name: Stage static site
        run: |
          mkdir -p site/data
          cp index.html app.js styles.css refresh_status.js refresh_status.css species.css species_inat.js processing.js processing.css hero.css scientific_names.js garden_progress.js garden_progress.css garden_badges.js garden_badges.css sample_weather.js sample_weather.css sample_subject.js sample_subject.css inaturalist.js inaturalist.css metabolome.js metabolome.css chemcalc.js chemcalc.css ms_profile.js ms_profile.css gnps_dashboard.js gnps_dashboard.css ms_compare.js ms_compare.css collectors.js collectors.css collector_map.js site/
          cp -R assets site/assets
          cp data/samples.json data/collectors.json data/processing.json data/garden_progress.json data/gardens.json data/inaturalist.json data/wikidata_taxa.json data/ms_profile.json site/data/
          if [ -f data/refresh.json ]; then cp data/refresh.json site/data/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
